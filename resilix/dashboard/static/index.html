<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>ResiliX — Resilience Operations Console</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305090d'/%3E%3Cpath d='M16 4l10 4.4v7.4c0 5.6-3.8 10.2-10 12.2-6.2-2-10-6.6-10-12.2V8.4L16 4z' fill='none' stroke='%232ce8d2' stroke-width='2'/%3E%3Cpath d='M19.5 10.5h-6.2l-1.6 4h5l-4.4 7.4 8.4-9.2h-4.6l3.4-2.2z' fill='%232ce8d2'/%3E%3C/svg%3E">
</head>
<body>

<aside id="sidebar" class="sidebar">
  <div class="sidebar-brand">
    <img class="sidebar-logo" src="/assets/resilix-logo.png" alt="ResiliX" width="32" height="32">
    <div class="sidebar-branding">
      <div class="sidebar-title">RESILIX</div>
      <div class="sidebar-subtitle">Operations Console</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span><span class="nav-label">Overview</span></button>
    <button class="nav-item" data-view="new-test"><span class="nav-icon">＋</span><span class="nav-label">New Test</span></button>
    <button class="nav-item" data-view="tests"><span class="nav-icon">◎</span><span class="nav-label">Tests</span></button>
    <button class="nav-item" data-view="findings"><span class="nav-icon">◇</span><span class="nav-label">Findings</span></button>
    <button class="nav-item" data-view="live"><span class="nav-icon">◉</span><span class="nav-label">Live Feed</span></button>
    <button class="nav-item" data-view="reports"><span class="nav-icon">▣</span><span class="nav-label">Reports</span></button>
    <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span class="nav-label">Settings</span></button>
  </nav>
  <div class="sidebar-footer"><span class="sidebar-version">v2.0.0</span></div>
</aside>

<header class="topbar">
  <div class="topbar-left">
    <input type="text" id="search-input" class="search-box" placeholder="Search tests, findings, reports..." autocomplete="off">
  </div>
  <div class="topbar-right">
    <div id="status-indicator" class="status-indicator">
      <span class="status-dot idle"></span>
      <span class="status-text">IDLE</span>
    </div>
    <button id="new-test-btn" class="btn btn-primary" data-view="new-test">+ NEW TEST</button>
  </div>
</header>

<main id="main" class="main">
  <section id="view-overview" class="view"></section>
  <section id="view-new-test" class="view hidden"></section>
  <section id="view-tests" class="view hidden"></section>
  <section id="view-test-detail" class="view hidden"></section>
  <section id="view-findings" class="view hidden"></section>
  <section id="view-live" class="view hidden"></section>
  <section id="view-reports" class="view hidden"></section>
  <section id="view-settings" class="view hidden"></section>
</main>

<script src="/app.js"></script>
</body>
</html>
